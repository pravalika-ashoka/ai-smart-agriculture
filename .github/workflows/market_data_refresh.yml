name: Refresh Karnataka Market Data

on:
  workflow_dispatch:
  schedule:
    # Runs daily at 02:30 AM IST (21:00 UTC)
    - cron: "0 21 * * *"

permissions:
  contents: write

concurrency:
  group: market-data-refresh
  cancel-in-progress: false

jobs:
  refresh-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # --------------------------------------------------
      # 1. Check out repository
      # --------------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Set up Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------------------
      # 3. Diagnose Data.gov.in connectivity
      # --------------------------------------------------
      - name: Diagnose Data.gov.in connectivity
        run: |
          python - <<'PY'
          import socket
          import subprocess

          host = "api.data.gov.in"
          port = 443

          print("=" * 60)
          print("DATA.GOV.IN CONNECTIVITY DIAGNOSTICS")
          print("=" * 60)

          try:
              addresses = sorted({
                  item[4][0]
                  for item in socket.getaddrinfo(
                      host,
                      port,
                      type=socket.SOCK_STREAM,
                  )
              })

              print(f"Resolved addresses: {addresses}")

          except OSError as exc:
              print(f"DNS error: {exc!r}")
              raise

          for address in addresses:
              print(f"\nTesting TCP connection to {address}:{port}")

              try:
                  with socket.create_connection(
                      (address, port),
                      timeout=10,
                  ):
                      print("TCP connection succeeded.")

              except OSError as exc:
                  print(f"TCP connection failed: {exc!r}")

          print("\nTesting HTTPS using curl...")

          try:
              result = subprocess.run(
                  [
                      "curl",
                      "-sS",
                      "-o",
                      "/dev/null",
                      "-w",
                      "HTTP status: %{http_code}\n",
                      "--connect-timeout",
                      "10",
                      "--max-time",
                      "20",
                      "https://api.data.gov.in/",
                  ],
                  capture_output=True,
                  text=True,
                  timeout=25,
              )

              print(result.stdout)

              if result.stderr:
                  print(
                      "curl diagnostics: "
                      + result.stderr.strip()
                  )

              print(f"curl exit code: {result.returncode}")

          except subprocess.TimeoutExpired:
              print("curl timed out after 25 seconds.")

          print("\nConnectivity diagnostics completed.")
          PY

      # --------------------------------------------------
      # 4. Fetch official Data.gov.in market data
      # --------------------------------------------------
      - name: Fetch official Data.gov.in market data
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import random
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          RESOURCE_ID = "9ef84268-d588-465a-a308-a864a43d0070"
          API_URL = (
              f"https://api.data.gov.in/resource/{RESOURCE_ID}"
          )

          STATE = "Karnataka"
          PAGE_SIZE = 100
          MAX_RECORDS = 100000
          MAX_RETRIES = 5
          TIMEOUT = 120

          api_key = os.environ.get(
              "DATA_GOV_API_KEY",
              "",
          ).strip()

          if not api_key:
              raise RuntimeError(
                  "DATA_GOV_API_KEY is missing from GitHub Secrets."
              )

          def fetch_page(offset, requested):
              params = {
                  "api-key": api_key,
                  "format": "json",
                  "limit": requested,
                  "offset": offset,
              }

              url = API_URL + "?" + urlencode(params)

              for attempt in range(MAX_RETRIES):
                  request = Request(
                      url,
                      headers={
                          "User-Agent": "AI-Smart-Agriculture/1.0",
                          "Accept": "application/json",
                      },
                  )

                  try:
                      with urlopen(
                          request,
                          timeout=TIMEOUT,
                      ) as response:
                          payload = json.loads(
                              response.read().decode("utf-8")
                          )

                      if not isinstance(payload, dict):
                          raise RuntimeError(
                              "Unexpected Data.gov.in response format."
                          )

                      records = payload.get("records")

                      if not isinstance(records, list):
                          raise RuntimeError(
                              "API response does not contain a records list."
                          )

                      return records

                  except HTTPError as exc:
                      if exc.code not in (
                          408,
                          425,
                          429,
                          500,
                          502,
                          503,
                          504,
                      ):
                          raise RuntimeError(
                              f"Data.gov.in returned HTTP {exc.code}. "
                              "Check the API response and configured secret."
                          ) from None

                      if attempt == MAX_RETRIES - 1:
                          raise RuntimeError(
                              f"HTTP {exc.code} after "
                              f"{MAX_RETRIES} attempts."
                          ) from None

                      delay = (
                          min(60, 5 * (2 ** attempt))
                          + random.random()
                      )

                      print(
                          f"HTTP {exc.code} at offset {offset}; "
                          f"retrying in {delay:.1f} seconds."
                      )

                      time.sleep(delay)

                  except (
                      URLError,
                      TimeoutError,
                      ConnectionError,
                      OSError,
                  ) as exc:
                      print(
                          f"Network error type: {type(exc).__name__}"
                      )
                      print(f"Network error details: {exc!r}")

                      if isinstance(exc, URLError):
                          print(
                              f"Underlying reason: {exc.reason!r}"
                          )

                      if attempt == MAX_RETRIES - 1:
                          raise RuntimeError(
                              f"Connection failed at offset {offset} "
                              f"after {MAX_RETRIES} attempts: {exc!r}"
                          ) from exc

                      delay = (
                          min(60, 5 * (2 ** attempt))
                          + random.random()
                      )

                      print(
                          f"Network error at offset {offset}; "
                          f"retrying in {delay:.1f} seconds."
                      )

                      time.sleep(delay)

              raise RuntimeError("Request retries exhausted.")

          # Fetch every page before modifying the existing cache.
          all_records = []
          offset = 0

          while offset < MAX_RECORDS:
              requested = min(
                  PAGE_SIZE,
                  MAX_RECORDS - offset,
              )

              print(
                  f"Fetching offset={offset}, limit={requested}"
              )

              page = fetch_page(offset, requested)

              print(f"Records received: {len(page)}")

              if not page:
                  print("No more records available.")
                  break

              if not all(
                  isinstance(record, dict)
                  for record in page
              ):
                  raise RuntimeError(
                      f"Invalid record format at offset {offset}. "
                      "Existing cache preserved."
                  )

              all_records.extend(page)
              offset += len(page)

              print(
                  f"Total records fetched: {len(all_records)}"
              )

              if len(page) < requested:
                  print("Final page reached.")
                  break

              time.sleep(1)

          if not all_records:
              raise RuntimeError(
                  "The API returned no records. "
                  "Existing cache preserved."
              )

          # Filter Karnataka records locally.
          print("Filtering Karnataka records...")

          karnataka_records = []

          for record in all_records:
              if (
                  str(record.get("state", "")).strip().casefold()
                  != STATE.casefold()
              ):
                  continue

              karnataka_records.append({
                  "state": record.get("state"),
                  "district": record.get("district"),
                  "market": record.get("market"),
                  "commodity": record.get("commodity"),
                  "variety": record.get("variety"),
                  "grade": record.get("grade"),
                  "arrival_date": record.get("arrival_date"),
                  "min_price": record.get("min_price"),
                  "max_price": record.get("max_price"),
                  "modal_price": record.get("modal_price"),
              })

          # Remove exact duplicates.
          unique_records = []
          seen = set()

          for record in karnataka_records:
              key = tuple(
                  json.dumps(
                      value,
                      sort_keys=True,
                      ensure_ascii=False,
                      default=str,
                  )
                  for value in record.values()
              )

              if key in seen:
                  continue

              seen.add(key)
              unique_records.append(record)

          if not unique_records:
              raise RuntimeError(
                  "No Karnataka records found in the fetched data. "
                  "The API may have returned records from other states. "
                  "Existing cache preserved."
              )

          # Construct cache.
          cache = {
              "success": True,
              "updated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "source": "Data.gov.in",
              "resource_id": RESOURCE_ID,
              "state": STATE,
              "total": len(unique_records),
              "records": unique_records,
          }

          cache_path = Path(
              "backend/data/market_cache.json"
          )

          cache_path.parent.mkdir(
              parents=True,
              exist_ok=True,
          )

          temporary_path = cache_path.with_suffix(
              ".json.tmp"
          )

          # Write a temporary file first.
          temporary_path.write_text(
              json.dumps(
                  cache,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          # Replace the old cache only after successful validation.
          temporary_path.replace(cache_path)

          print("=" * 60)
          print("MARKET DATA CACHE UPDATED SUCCESSFULLY")
          print(f"API records fetched: {len(all_records)}")
          print(f"Karnataka records: {len(karnataka_records)}")
          print(f"Unique records saved: {len(unique_records)}")
          print(f"Cache: {cache_path}")
          print("=" * 60)
          PY

      # --------------------------------------------------
      # 5. Commit updated market cache
      # --------------------------------------------------
      - name: Commit updated market cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add backend/data/market_cache.json

          if git diff --cached --quiet; then
            echo "Market cache has no changes to commit."
          else
            git commit -m "Update Karnataka market data"
            git push
          fi

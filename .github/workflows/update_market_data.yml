name: Update Market Data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update_market_data.yml"

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch official Data.gov.in market data
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          RESOURCE_ID = "9ef84268-d588-465a-a308-a864a43d0070"
          API_URL = f"https://api.data.gov.in/resource/{RESOURCE_ID}"

          STATE = "Karnataka"

          # Request manageable pages instead of assuming the API
          # will return 10,000 records in every response.
          PAGE_SIZE = 1000
          MAX_RECORDS = 50000
          MAX_RETRIES = 3

          # --------------------------------------------------
          # Validate API key
          # --------------------------------------------------

          api_key = os.environ.get("DATA_GOV_API_KEY", "").strip()

          if not api_key:
              raise RuntimeError(
                  "DATA_GOV_API_KEY GitHub Secret is missing or empty."
              )

          # --------------------------------------------------
          # Fetch records from Data.gov.in
          # --------------------------------------------------

          all_records = []
          offset = 0

          while offset < MAX_RECORDS:
              limit = min(PAGE_SIZE, MAX_RECORDS - offset)

              params = {
                  "api-key": api_key,
                  "format": "json",
                  "limit": limit,
                  "offset": offset,
              }

              url = API_URL + "?" + urlencode(params)

              print("=" * 60)
              print(
                  f"Fetching market data: offset={offset}, limit={limit}"
              )
              print("=" * 60)

              request = Request(
                  url,
                  headers={
                      "User-Agent": "AI-Smart-Agriculture/1.0",
                      "Accept": "application/json",
                  },
              )

              data = None

              for attempt in range(1, MAX_RETRIES + 1):
                  try:
                      with urlopen(request, timeout=120) as response:
                          raw_data = response.read()

                      data = json.loads(raw_data.decode("utf-8"))

                      if not isinstance(data, dict):
                          raise RuntimeError(
                              "Data.gov.in returned an unexpected JSON structure."
                          )

                      break

                  except HTTPError as error:
                      print(
                          f"HTTP error on attempt {attempt}: "
                          f"status={error.code}"
                      )

                      if attempt == MAX_RETRIES:
                          raise RuntimeError(
                              f"Data.gov.in request failed at offset "
                              f"{offset} with HTTP {error.code}."
                          ) from error

                  except (URLError, TimeoutError, json.JSONDecodeError) as error:
                      print(
                          f"Request failed on attempt {attempt}: "
                          f"{type(error).__name__}"
                      )

                      if attempt == MAX_RETRIES:
                          raise RuntimeError(
                              f"Could not retrieve valid market data "
                              f"at offset {offset}."
                          ) from error

                  time.sleep(attempt * 2)

              # Check whether the API returned an error in its JSON body.
              if data.get("error"):
                  raise RuntimeError(
                      "Data.gov.in API error: "
                      + str(data["error"])[:500]
                  )

              records = data.get("records")

              if not isinstance(records, list):
                  raise RuntimeError(
                      "Data.gov.in response does not contain a valid records list. "
                      f"Response keys: {list(data.keys())}"
                  )

              print(f"Records received: {len(records)}")

              if not records:
                  print("No more records available.")
                  break

              valid_records = [
                  record for record in records
                  if isinstance(record, dict)
              ]

              all_records.extend(valid_records)

              print(f"Total records collected: {len(all_records)}")

              # Advance by the number returned, not the requested page size.
              offset += len(records)

              # Stop when the API returns fewer records than requested.
              if len(records) < limit:
                  print("Final page reached.")
                  break

              time.sleep(1)

          # --------------------------------------------------
          # Validate fetched data
          # --------------------------------------------------

          if not all_records:
              raise RuntimeError(
                  "Data.gov.in returned zero records. "
                  "The cache was not changed."
              )

          print(f"Total API records fetched: {len(all_records)}")

          print("Sample record fields:", list(all_records[0].keys()))

          # --------------------------------------------------
          # Filter Karnataka records locally
          # --------------------------------------------------

          karnataka_records = []

          for record in all_records:
              record_state = str(record.get("state") or "").strip()

              if record_state.casefold() != STATE.casefold():
                  continue

              karnataka_records.append({
                  "state": record.get("state"),
                  "district": record.get("district"),
                  "market": record.get("market"),
                  "commodity": record.get("commodity"),
                  "variety": record.get("variety"),
                  "grade": record.get("grade"),
                  "arrival_date": record.get("arrival_date"),
                  "min_price": record.get("min_price"),
                  "max_price": record.get("max_price"),
                  "modal_price": record.get("modal_price"),
              })

          print(f"Karnataka records found: {len(karnataka_records)}")

          # --------------------------------------------------
          # Remove duplicates
          # --------------------------------------------------

          unique_records = []
          seen = set()

          for record in karnataka_records:
              key = (
                  record.get("state"),
                  record.get("district"),
                  record.get("market"),
                  record.get("commodity"),
                  record.get("variety"),
                  record.get("grade"),
                  record.get("arrival_date"),
                  record.get("min_price"),
                  record.get("max_price"),
                  record.get("modal_price"),
              )

              if key in seen:
                  continue

              seen.add(key)
              unique_records.append(record)

          if not unique_records:
              raise RuntimeError(
                  "No Karnataka market records were found in the fetched data. "
                  "The existing cache was preserved."
              )

          # --------------------------------------------------
          # Calculate statistics
          # --------------------------------------------------

          districts = sorted({
              str(record["district"]).strip()
              for record in unique_records
              if record.get("district")
          })

          markets = sorted({
              str(record["market"]).strip()
              for record in unique_records
              if record.get("market")
          })

          commodities = sorted({
              str(record["commodity"]).strip()
              for record in unique_records
              if record.get("commodity")
          })

          print("=" * 60)
          print("KARNATAKA MARKET DATA SUMMARY")
          print("=" * 60)
          print(f"Total records fetched: {len(all_records)}")
          print(f"Karnataka records found: {len(karnataka_records)}")
          print(f"Unique records stored: {len(unique_records)}")
          print(f"Districts found: {len(districts)}")
          print(f"Markets found: {len(markets)}")
          print(f"Commodities found: {len(commodities)}")

          print("Districts:", ", ".join(districts))
          print("Markets:", ", ".join(markets))
          print("Commodities:", ", ".join(commodities))

          # --------------------------------------------------
          # Create cache
          # --------------------------------------------------

          cache = {
              "success": True,
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "source": "Data.gov.in",
              "resource_id": RESOURCE_ID,
              "state": STATE,
              "total": len(unique_records),
              "records": unique_records,
          }

          # --------------------------------------------------
          # Save cache atomically
          # --------------------------------------------------

          cache_path = Path("backend/data/market_cache.json")
          cache_path.parent.mkdir(parents=True, exist_ok=True)

          temporary_path = cache_path.with_suffix(".json.tmp")

          temporary_path.write_text(
              json.dumps(
                  cache,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          temporary_path.replace(cache_path)

          print("=" * 60)
          print("Karnataka market cache updated successfully.")
          print(f"Records stored: {len(unique_records)}")
          print(f"Cache path: {cache_path}")
          print("=" * 60)
          PY

      - name: Commit updated market cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add backend/data/market_cache.json

          if git diff --cached --quiet; then
            echo "Market cache has no changes to commit."
          else
            git commit -m "Update Karnataka market price cache"
            git push
          fi
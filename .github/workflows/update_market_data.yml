name: Update Market Data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update_market_data.yml"

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Set up Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------------------
      # 3. Diagnose Data.gov.in connectivity
      # --------------------------------------------------
      - name: Diagnose Data.gov.in connectivity
        run: |
          echo "=========================================="
          echo "DNS LOOKUP"
          echo "=========================================="

          getent ahosts api.data.gov.in || true

          echo ""
          echo "=========================================="
          echo "CURL HTTPS GET TEST"
          echo "=========================================="

          curl -sS \
            -o /tmp/data-gov-response.txt \
            -w "HTTP status: %{http_code}\n" \
            --connect-timeout 15 \
            --max-time 25 \
            "https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070?format=json&limit=1" \
            || true

          echo ""
          echo "Response preview:"
          head -c 500 /tmp/data-gov-response.txt 2>/dev/null || true

          echo ""
          echo "=========================================="
          echo "PYTHON HTTPS GET TEST"
          echo "=========================================="

          python - <<'PY'
          import urllib.request
          import urllib.error

          url = (
              "https://api.data.gov.in/resource/"
              "9ef84268-d588-465a-a308-a864a43d0070"
              "?format=json&limit=1"
          )

          try:
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "AI-Smart-Agriculture/1.0",
                      "Accept": "application/json",
                  },
              )

              with urllib.request.urlopen(
                  request,
                  timeout=20,
              ) as response:
                  print("HTTP status:", response.status)
                  print(
                      response.read(300).decode(
                          "utf-8",
                          errors="replace",
                      )
                  )

          except urllib.error.HTTPError as error:
              print("HTTP status:", error.code)
              print(
                  error.read(300).decode(
                      "utf-8",
                      errors="replace",
                  )
              )

          except Exception as error:
              print(type(error).__name__ + ":", repr(error))
          PY

          echo ""
          echo "Connectivity diagnostics completed."

      # --------------------------------------------------
      # 4. Fetch official market data
      # --------------------------------------------------
      - name: Fetch official Data.gov.in market data
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import socket
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          RESOURCE_ID = "9ef84268-d588-465a-a308-a864a43d0070"
          API_URL = (
              "https://api.data.gov.in/resource/"
              + RESOURCE_ID
          )

          STATE = "Karnataka"
          PAGE_SIZE = 1000
          MAX_RECORDS = 50000
          MAX_RETRIES = 5
          REQUEST_TIMEOUT = 90

          api_key = os.environ.get(
              "DATA_GOV_API_KEY", ""
          ).strip()

          if not api_key:
              raise RuntimeError(
                  "DATA_GOV_API_KEY GitHub Secret is missing or empty."
              )

          def fetch_page(offset, limit):
              params = {
                  "api-key": api_key,
                  "format": "json",
                  "limit": limit,
                  "offset": offset,
              }

              url = API_URL + "?" + urlencode(params)
              last_error = None

              for attempt in range(1, MAX_RETRIES + 1):
                  request = Request(
                      url,
                      headers={
                          "User-Agent": "AI-Smart-Agriculture/1.0",
                          "Accept": "application/json",
                      },
                  )

                  try:
                      print(
                          f"Fetching offset={offset}, "
                          f"limit={limit}, "
                          f"attempt={attempt}/{MAX_RETRIES}"
                      )

                      with urlopen(
                          request,
                          timeout=REQUEST_TIMEOUT,
                      ) as response:
                          raw_data = response.read()

                      data = json.loads(
                          raw_data.decode("utf-8")
                      )

                      if not isinstance(data, dict):
                          raise RuntimeError(
                              "Unexpected API response format."
                          )

                      if data.get("error"):
                          raise RuntimeError(
                              "Data.gov.in API error: "
                              + str(data["error"])[:300]
                          )

                      records = data.get("records")

                      if not isinstance(records, list):
                          raise RuntimeError(
                              "API response does not contain "
                              "a valid records list."
                          )

                      return data

                  except HTTPError as error:
                      last_error = error

                      print(
                          f"HTTP error on attempt "
                          f"{attempt}/{MAX_RETRIES}: "
                          f"status={error.code}"
                      )

                      if error.code not in (
                          408, 425, 429,
                          500, 502, 503, 504,
                      ):
                          raise RuntimeError(
                              f"Non-retryable HTTP error: "
                              f"{error.code}"
                          ) from error

                  except (
                      URLError,
                      TimeoutError,
                      socket.timeout,
                      ConnectionError,
                  ) as error:
                      last_error = error

                      print(
                          f"Connection error on attempt "
                          f"{attempt}/{MAX_RETRIES}: "
                          f"{error!r}"
                      )

                  if attempt < MAX_RETRIES:
                      wait_seconds = min(
                          5 * (2 ** (attempt - 1)),
                          60,
                      )

                      print(
                          f"Retrying in {wait_seconds} seconds..."
                      )
                      time.sleep(wait_seconds)

              raise RuntimeError(
                  f"Could not retrieve offset {offset} "
                  f"after {MAX_RETRIES} attempts. "
                  f"Last error: {last_error!r}"
              ) from last_error

          # Fetch records page by page.
          all_records = []
          offset = 0

          while offset < MAX_RECORDS:
              limit = min(
                  PAGE_SIZE,
                  MAX_RECORDS - offset,
              )

              print("=" * 60)
              print(
                  f"Fetching market data: "
                  f"offset={offset}, limit={limit}"
              )
              print("=" * 60)

              data = fetch_page(offset, limit)
              records = data["records"]

              print(
                  f"Records received: {len(records)}"
              )

              if not records:
                  print("No more records available.")
                  break

              all_records.extend(
                  record
                  for record in records
                  if isinstance(record, dict)
              )

              print(
                  f"Total records collected: "
                  f"{len(all_records)}"
              )

              offset += len(records)

              if len(records) < limit:
                  print("Final page reached.")
                  break

              time.sleep(1)

          if not all_records:
              raise RuntimeError(
                  "No market records were retrieved. "
                  "The existing cache was preserved."
              )

          print(
              f"Total API records fetched: {len(all_records)}"
          )

          # Filter Karnataka records locally.
          karnataka_records = []

          for record in all_records:
              record_state = str(
                  record.get("state") or ""
              ).strip()

              if record_state.casefold() != STATE.casefold():
                  continue

              karnataka_records.append({
                  "state": record.get("state"),
                  "district": record.get("district"),
                  "market": record.get("market"),
                  "commodity": record.get("commodity"),
                  "variety": record.get("variety"),
                  "grade": record.get("grade"),
                  "arrival_date": record.get("arrival_date"),
                  "min_price": record.get("min_price"),
                  "max_price": record.get("max_price"),
                  "modal_price": record.get("modal_price"),
              })

          print(
              f"Karnataka records found: "
              f"{len(karnataka_records)}"
          )

          if not karnataka_records:
              raise RuntimeError(
                  "No Karnataka records were found in the "
                  "retrieved pages. Existing cache preserved."
              )

          # Remove duplicate records.
          unique_records = []
          seen = set()

          for record in karnataka_records:
              key = tuple(
                  record.get(field)
                  for field in (
                      "state",
                      "district",
                      "market",
                      "commodity",
                      "variety",
                      "grade",
                      "arrival_date",
                      "min_price",
                      "max_price",
                      "modal_price",
                  )
              )

              if key in seen:
                  continue

              seen.add(key)
              unique_records.append(record)

          if not unique_records:
              raise RuntimeError(
                  "No unique Karnataka records remain. "
                  "Existing cache preserved."
              )

          districts = {
              str(record["district"]).strip()
              for record in unique_records
              if record.get("district")
          }

          markets = {
              str(record["market"]).strip()
              for record in unique_records
              if record.get("market")
          }

          commodities = {
              str(record["commodity"]).strip()
              for record in unique_records
              if record.get("commodity")
          }

          print("=" * 60)
          print("KARNATAKA MARKET DATA SUMMARY")
          print("=" * 60)
          print(f"API records fetched: {len(all_records)}")
          print(f"Karnataka records: {len(karnataka_records)}")
          print(f"Unique records: {len(unique_records)}")
          print(f"Districts: {len(districts)}")
          print(f"Markets: {len(markets)}")
          print(f"Commodities: {len(commodities)}")

          # Prepare the new cache only after validation.
          cache = {
              "success": True,
              "updated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "source": "Data.gov.in",
              "resource_id": RESOURCE_ID,
              "state": STATE,
              "total": len(unique_records),
              "records": unique_records,
          }

          cache_path = Path(
              "backend/data/market_cache.json"
          )

          cache_path.parent.mkdir(
              parents=True,
              exist_ok=True,
          )

          temporary_path = cache_path.with_suffix(
              ".json.tmp"
          )

          temporary_path.write_text(
              json.dumps(
                  cache,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          # Replace the cache atomically.
          temporary_path.replace(cache_path)

          print("=" * 60)
          print("Market cache updated successfully.")
          print(f"Records stored: {len(unique_records)}")
          print(f"Cache path: {cache_path}")
          print("=" * 60)
          PY

      # --------------------------------------------------
      # 5. Commit updated cache
      # --------------------------------------------------
      - name: Commit updated market cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add backend/data/market_cache.json

          if git diff --cached --quiet; then
            echo "Market cache has no changes to commit."
          else
            git commit -m "Update Karnataka market price cache"
            git push
          fi